name: CampusFind CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/predeployment-readiness]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Report frontend production dependency vulnerabilities
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/frontend-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP + "/frontend-audit.json"); console.log("Frontend audit totals:", r.metadata?.vulnerabilities); for (const [name, v] of Object.entries(r.vulnerabilities || {})) { const advisories=(v.via || []).filter(x => typeof x === "object").map(x => x.title + " (" + x.url + ")").join("; "); console.log(v.severity.toUpperCase(), name, "range=" + v.range, "direct=" + v.isDirect, "fix=" + JSON.stringify(v.fixAvailable), advisories); }'
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  functions:
    name: Functions lint, build, and Firebase rules tests
    runs-on: ubuntu-24.04
    env:
      CI: true
      GCLOUD_PROJECT: campusfind
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install repository tooling
        run: npm ci
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Report Functions production dependency vulnerabilities
        working-directory: functions
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/functions-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP + "/functions-audit.json"); console.log("Functions audit totals:", r.metadata?.vulnerabilities); for (const [name, v] of Object.entries(r.vulnerabilities || {})) { const advisories=(v.via || []).filter(x => typeof x === "object").map(x => x.title + " (" + x.url + ")").join("; "); console.log(v.severity.toUpperCase(), name, "range=" + v.range, "direct=" + v.isDirect, "fix=" + JSON.stringify(v.fixAvailable), advisories); }'
      - name: Lint Functions
        working-directory: functions
        run: npm run lint
      - name: Build Functions
        working-directory: functions
        run: npm run build
      - name: Test Firestore rules
        working-directory: functions
        run: npm run test:rules
      - name: Test Realtime Database rules
        working-directory: functions
        run: npm run test:database-rules
      - name: Test Storage rules
        working-directory: functions
        run: npm run test:storage-rules

  refresh-security-lockfiles:
    name: Refresh dependency lockfiles after security updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/predeployment-readiness'
    needs: [frontend, functions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply compatible frontend security updates
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Refresh Functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply compatible Functions security updates
        working-directory: functions
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json functions/package.json functions/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency updates were needed."
            exit 0
          fi
          git commit -m "chore: update vulnerable dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
